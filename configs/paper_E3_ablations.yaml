# E3 - Which parts of SAVER-VLA matter? Remove one component at a time.
# A fault mix that needs feedback-driven replanning: gripper release, a sabotaged first
# grasp attempt (40-90 steps), and a hidden +/-5 cm approach bias.
# 6 variants x 8 fresh initial states = 48 episodes (40 with GPT-5.5).
name: paper_E3_ablations
env: {backend: libero, episode_length: 1000}
faults:
  transport: gripper_release
  trial_impairment_steps: [40, 90]
  approach_bias_x_m: [-0.05, 0.05]
recovery: {agent: llm, model: gpt-5.5}
sweep:
  seeds: [5500]
  episode_indices: [2, 4, 5, 6, 8, 9, 12, 15]
  scenarios:
    full: {}
    no_trial_verification: {recovery.policy_trials: false}       # no verified grasp trials / outcome feedback
    no_capability_info: {recovery.capability_aware: false}       # agent not told which skills are available
    no_geometry_skills: {recovery.skills: [MOVE_TO_PREGRASP, APPROACH_OBJECT, REASSESS_STATE, RESUME_POLICY, ABORT_RECOVERY]}
    fault_disclosed: {recovery.blind: false}                     # agent told the fault type
    scripted_reference: {recovery.agent: scripted}
