# Reliability study: every combination of the grid values, for every seed and
# LIBERO initial state: 3 agents x 2 faults x 5 seeds x 2 states = 60 episodes.
name: reliability_v1
env:
  backend: libero
  episode_length: 850
faults:
  approach_bias_x_m: 0.0
recovery:
  model: gpt-5.5
sweep:
  seeds: [1000, 1001, 1002, 1003, 1004]
  episode_indices: [0, 1]
  grid:
    recovery.agent: [none, scripted, llm]
    faults.transport: [forced_separation, gripper_release]
